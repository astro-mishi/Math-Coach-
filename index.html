<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Algebra Coach</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--tx:#1b1f2a;--mut:#667085;--pri:#4f46e5;--ok:#16a34a;--bad:#dc2626;--bd:#e4e7ee;--okbg:#e8f7ee;--badbg:#fdecec;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10131a;--card:#1a1f2b;--tx:#eef0f6;--mut:#9aa3b5;--pri:#818cf8;--bd:#2b3243;--okbg:#12301f;--badbg:#3a1717}}
:root[data-theme="dark"]{--bg:#10131a;--card:#1a1f2b;--tx:#eef0f6;--mut:#9aa3b5;--pri:#818cf8;--bd:#2b3243;--okbg:#12301f;--badbg:#3a1717}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,Segoe UI,sans-serif}
main{max-width:760px;margin:0 auto;padding:16px 16px 60px}
h1{font-size:26px;margin:8px 0 2px}p.sub{color:var(--mut);margin:0 0 16px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:18px;margin-bottom:16px}
button{font:inherit;border:0;border-radius:10px;padding:10px 16px;background:var(--pri);color:#fff;cursor:pointer;font-weight:600}
button.ghost{background:transparent;color:var(--pri);border:1px solid var(--bd)}button.on{background:var(--pri);color:#fff}button:disabled{opacity:.5}
textarea,input[type=text]{width:100%;box-sizing:border-box;font:inherit;padding:10px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx)}
label{display:block;font-weight:600;margin:12px 0 6px}
.q{font-size:20px;font-weight:600;white-space:pre-wrap}.tag{color:var(--pri);font-weight:700;font-size:14px}
.res{border-radius:12px;padding:14px;margin-top:14px}.res.ok{background:var(--okbg)}.res.bad{background:var(--badbg)}
.bar{height:6px;background:var(--bd);border-radius:3px;margin-bottom:14px}.bar i{display:block;height:100%;background:var(--pri);border-radius:3px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;align-items:center}img.prev,.proof{max-width:100%;border-radius:10px;margin-top:10px;border:1px solid var(--bd)}
.hide{display:none}.err{color:var(--bad)}
canvas{width:100%;aspect-ratio:2/1;background:#fff;border:2px dashed var(--bd);border-radius:12px;touch-action:none;cursor:crosshair;display:block}
.tabs{display:flex;gap:8px;margin:10px 0 16px}.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-bottom:16px}
.stat{border:1px solid var(--bd);border-radius:12px;padding:10px;background:var(--card)}.stat b{display:block;font-size:20px}
.item{border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px;background:var(--card)}
.pill{font-size:12px;font-weight:700;padding:2px 8px;border-radius:99px}.pill.ok{background:var(--okbg);color:var(--ok)}.pill.bad{background:var(--badbg);color:var(--bad)}
code{background:var(--bg);padding:1px 5px;border-radius:5px}
</style></head><body><main>
<h1>📐 Algebra Coach</h1>
<p class="sub">Snap your textbook exercise, write or photograph your working, and get pinpoint feedback.</p>
<div class="tabs"><button id="tS" class="on">Student space</button><button id="tT" class="ghost hide">Teacher space</button></div>

<div id="student">
<section id="upload" class="card">
<strong>1. Your name &amp; exercise photo</strong>
<label for="name">Your name</label><input type="text" id="name" placeholder="e.g. Ayesha">
<label for="file">Photo of the textbook exercise</label>
<input type="file" id="file" accept="image/*"><img id="prev" class="prev hide" alt="">
<div class="row"><button id="go" disabled>Read my exercise</button></div>
<p id="status" class="sub"></p>
</section>

<section id="practice" class="card hide">
<div class="bar"><i id="prog" style="width:0"></i></div>
<div class="tag" id="label"></div><div class="q" id="qtext"></div>
<div class="tabs" style="margin-bottom:8px"><button class="on" data-m="draw">✍️ Write on screen</button><button class="ghost" data-m="photo">📷 Upload photo of my working</button><button class="ghost" data-m="type">⌨️ Type</button></div>
<div id="m-draw"><canvas id="cv" width="1000" height="500"></canvas>
<div class="row"><button class="ghost" id="undo">↶ Undo</button><button class="ghost" id="clr">Clear</button><span class="sub" style="margin:0">Write each step on a new line</span></div></div>
<div id="m-photo" class="hide"><input type="file" id="wfile" accept="image/*"><img id="wprev" class="prev hide" alt=""></div>
<div id="m-type" class="hide"><textarea id="work" rows="5" placeholder="2x + 6 = 14&#10;2x = 8&#10;x = 4"></textarea></div>
<label for="ans">Final answer (optional if it's clear in your working)</label><input type="text" id="ans" placeholder="e.g. x = 4">
<div class="row"><button id="check">Check my answer</button><button id="next" class="ghost hide">Next part →</button></div>
<div id="result"></div>
</section>
<section id="done" class="card hide"><h2 style="margin-top:0">🎉 All done!</h2><p id="score"></p><button id="again">Try another exercise</button></section>
</div>

<div id="teacher" class="hide">
<div class="card"><strong>Class progress</strong><p class="sub" style="margin:4px 0 0">Updates live as students submit. Each mistake shows the exact step in the student's own handwriting.</p>
<div class="row"><label style="margin:0"><input type="checkbox" id="onlyBad" checked> Only mistakes</label><select id="who"></select></div></div>
<div id="stats" class="stats"></div><div id="feed"></div>
</div>
</main>
<script>
let sample=null,db=null,user=null,uid="anon",problems=[],idx=0,right=0,blob=null,wblob=null,busy=false,mode="draw",strokes=[],cur=null,all=[];
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const safeImg=u=>typeof u==="string"&&u.startsWith("data:image/jpeg;base64,")?u:"";
try{$("name").value=localStorage.getItem("ac_name")||""}catch(e){}
(async()=>{
 try{sample=await claude.use("sample")}catch(e){}
 try{db=await claude.use("db");user=await claude.use("user");if(user){uid=String(await user.id());if(user.canEdit())$("tT").classList.remove("hide")}}catch(e){}
 if(!sample)$("status").textContent="AI features aren't available in this view. Open this page from claude.ai.";
 if(db&&user&&user.canEdit())listen();
})();

/* ---------- images ---------- */
const loadImg=b=>new Promise((res,rej)=>{const im=new Image();im.onload=()=>res(im);im.onerror=()=>rej(new Error("Could not read that image."));im.src=URL.createObjectURL(b)});
const toBlob=(c,q)=>new Promise((res,rej)=>c.toBlob(b=>b?res(b):rej(new Error("img")),"image/jpeg",q));
async function shrink(b,max,q){const im=await loadImg(b),s=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement("canvas");
 c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);const x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);return toBlob(c,q)}
const dataUrl=b=>new Promise(res=>{const r=new FileReader();r.onload=()=>res(r.result);r.readAsDataURL(b)});
async function crop(b,bx){const im=await loadImg(b);let {x,y,w,h}=bx;const px=.04,py=.06;
 x=Math.max(0,x-px);y=Math.max(0,y-py);w=Math.min(1-x,w+2*px);h=Math.min(1-y,h+2*py);
 const sw=im.width*w,sh=im.height*h,s=Math.min(1,700/sw),c=document.createElement("canvas");c.width=Math.max(1,sw*s);c.height=Math.max(1,sh*s);
 c.getContext("2d").drawImage(im,im.width*x,im.height*y,sw,sh,0,0,c.width,c.height);return c.toDataURL("image/jpeg",.75)}

$("file").onchange=async e=>{const f=e.target.files[0];if(!f)return;
 try{blob=await shrink(f,1600,.85);$("prev").src=URL.createObjectURL(blob);$("prev").classList.remove("hide");$("go").disabled=!sample}catch(x){$("status").innerHTML='<span class="err">Could not read that image.</span>'}};
$("wfile").onchange=async e=>{const f=e.target.files[0];if(!f)return;
 try{wblob=await shrink(f,1400,.85);$("wprev").src=URL.createObjectURL(wblob);$("wprev").classList.remove("hide")}catch(x){$("result").innerHTML='<p class="err">Could not read that image.</p>'}};

/* ---------- tabs ---------- */
function tab(t){$("student").classList.toggle("hide",t!=="s");$("teacher").classList.toggle("hide",t!=="t");
 $("tS").className=t==="s"?"on":"ghost";$("tT").className=(t==="t"?"on":"ghost")+($("tT").classList.contains("hide")?" hide":"")}
$("tS").onclick=()=>tab("s");$("tT").onclick=()=>tab("t");
document.querySelectorAll("[data-m]").forEach(b=>b.onclick=()=>{mode=b.dataset.m;
 document.querySelectorAll("[data-m]").forEach(x=>x.className=x===b?"on":"ghost");
 ["draw","photo","type"].forEach(m=>$("m-"+m).classList.toggle("hide",m!==mode))});

/* ---------- handwriting canvas ---------- */
const cv=$("cv"),cx=cv.getContext("2d");
function redraw(){cx.fillStyle="#fff";cx.fillRect(0,0,cv.width,cv.height);cx.strokeStyle="#111";cx.lineWidth=5;cx.lineCap=cx.lineJoin="round";
 for(const s of strokes){cx.beginPath();s.forEach((p,i)=>i?cx.lineTo(p.x,p.y):cx.moveTo(p.x,p.y));if(s.length===1)cx.lineTo(s[0].x+.1,s[0].y);cx.stroke()}}
const pt=e=>{const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)*cv.width/r.width,y:(e.clientY-r.top)*cv.height/r.height}};
cv.onpointerdown=e=>{cv.setPointerCapture(e.pointerId);cur=[pt(e)];strokes.push(cur);redraw()};
cv.onpointermove=e=>{if(!cur)return;cur.push(pt(e));redraw()};
cv.onpointerup=cv.onpointercancel=()=>{cur=null};
$("undo").onclick=()=>{strokes.pop();redraw()};$("clr").onclick=()=>{strokes=[];redraw()};redraw();

/* ---------- read exercise ---------- */
$("go").onclick=async()=>{if(!sample||!blob||busy)return;
 if(!$("name").value.trim()){$("status").innerHTML='<span class="err">Please enter your name.</span>';return}
 try{localStorage.setItem("ac_name",$("name").value.trim())}catch(e){}
 busy=true;$("go").disabled=true;$("status").textContent="Reading and solving your exercise in the background… (about 20-40 seconds)";
 try{
  const lim=await sample.limits();if(!lim.images)throw new Error("Image reading isn't enabled here.");
  const r=await sample.json(`You are an expert algebra teacher. The attached image is a textbook algebra exercise.
1. Split it into individual parts the student answers one at a time (e.g. 1(a), 1(b), 2(a)...). Keep textbook order. Maximum 12 parts.
2. Solve each part carefully yourself and verify the answer.
Return ONLY JSON, no markdown: {"problems":[{"label":"1(a)","question":"exact problem text, math in plain text like x^2 + 3x = 10","solution_steps":["step 1","step 2"],"final_answer":"x = 4"}]}
If there are no algebra problems return {"problems":[]}.`,{images:[blob],modelTier:"complex",cache:false});
  problems=(r&&r.problems)||[];
  if(!problems.length){$("status").innerHTML='<span class="err">I couldn\'t find algebra problems. Try a clearer photo.</span>';return}
  idx=0;right=0;$("upload").classList.add("hide");$("practice").classList.remove("hide");show();
 }catch(e){$("status").innerHTML='<span class="err">Something went wrong: '+esc(e.message||e.code||"try again")+'</span>'}
 finally{busy=false;$("go").disabled=false}};

function show(){const p=problems[idx];$("label").textContent=`Question ${p.label}  ·  ${idx+1} of ${problems.length}`;
 $("qtext").textContent=p.question;strokes=[];redraw();wblob=null;$("wprev").classList.add("hide");$("wfile").value="";
 $("work").value="";$("ans").value="";$("result").innerHTML="";$("next").classList.add("hide");$("check").disabled=false;$("prog").style.width=(idx/problems.length*100)+"%"}

/* ---------- check ---------- */
$("check").onclick=async()=>{if(busy)return;const p=problems[idx],a=$("ans").value.trim(),typed=$("work").value.trim();
 let img=null;
 try{
  if(mode==="draw"&&strokes.length)img=await toBlob(cv,.9);
  else if(mode==="photo"&&wblob)img=wblob;
  else if(mode==="type"&&!typed&&!a)throw new Error("Write your working first.");
  if(!img&&!(mode==="type"&&(typed||a))&&!a)throw new Error(mode==="photo"?"Upload a photo of your working first.":"Write your working first.");
 }catch(e){$("result").innerHTML='<p class="err">'+esc(e.message)+'</p>';return}
 busy=true;$("check").disabled=true;$("result").innerHTML='<p class="sub">Reading your working and checking it…</p>';
 try{
  const r=await sample.json(`You are a kind, precise algebra tutor. Compare a student's work with the verified solution.
PROBLEM: ${p.question}
VERIFIED SOLUTION STEPS: ${JSON.stringify(p.solution_steps)}
VERIFIED FINAL ANSWER: ${p.final_answer}
${img?"The attached image is the student's HANDWRITTEN working. Read it carefully (text recognition).":"STUDENT WORKING: "+(typed||"(none shown)")}
STUDENT TYPED FINAL ANSWER: ${a||"(none; read it from the image)"}
Rules: correct if mathematically equivalent (x=4 and 4; 1/2 and 0.5; roots in any order). If the final answer is right but a shown step is wrong, mark correct but mention it.
If incorrect: find the FIRST wrong step, quote it, explain simply, give the corrected path.
${img?'Also give wrong_step_box: the bounding box of ONLY that wrong line in the image, as fractions of image width/height from the top-left: {"x":0-1,"y":0-1,"w":0-1,"h":0-1}. Use null if correct or unsure.':""}
Return ONLY JSON: {"transcription":"the student's working as text, one step per line","correct":true|false,"first_wrong_step":"quoted step or empty","explanation":"short encouraging plain language","corrected_working":"correct steps from that point, or empty","wrong_step_box":null}`,
  {images:img?[img]:undefined,modelTier:"complex",cache:false});
  const ok=!!r.correct;if(ok)right++;
  let h=`<div class="res ${ok?"ok":"bad"}"><strong>${ok?"✅ Correct!":"❌ Not quite"}</strong>`;
  if(!ok&&r.first_wrong_step)h+=`<p><b>Where it went wrong:</b><br><code>${esc(r.first_wrong_step)}</code></p>`;
  if(r.explanation)h+=`<p>${esc(r.explanation)}</p>`;
  if(!ok&&r.corrected_working)h+=`<p><b>Correct way:</b></p><div style="white-space:pre-wrap">${esc(r.corrected_working)}</div><p><b>Answer:</b> ${esc(p.final_answer)}</p>`;
  $("result").innerHTML=h+`</div><p class="sub" id="saved" style="margin-top:8px">${db?"Sending to your teacher…":""}</p>`;
  $("next").classList.remove("hide");$("next").textContent=idx===problems.length-1?"Finish":"Next part →";
  if(db)save(p,r,ok,img,typed||a).then(()=>{$("saved").textContent="✓ Shared with your teacher"}).catch(()=>{$("saved").textContent="(Couldn't share with teacher — ask them to give you access.)"});
 }catch(e){$("result").innerHTML='<p class="err">Could not check: '+esc(e.message||e.code||"try again")+'</p>';$("check").disabled=false}
 finally{busy=false}};

async function save(p,r,ok,img,typed){
 const d={studentId:uid,studentName:$("name").value.trim()||"Student",label:p.label,question:p.question,correct:ok,expected:p.final_answer,
  transcription:String(r.transcription||typed||""),firstWrongStep:ok?"":String(r.first_wrong_step||""),explanation:String(r.explanation||""),corrected:ok?"":String(r.corrected_working||""),
  cropUrl:"",fullUrl:"",teacherNote:"",reviewed:false,ts:Date.now()};
 if(img){d.fullUrl=await dataUrl(await shrink(img,800,.55));
  const b=r.wrong_step_box;if(!ok&&b&&[b.x,b.y,b.w,b.h].every(n=>typeof n==="number"&&n>=0&&n<=1)&&b.w>0&&b.h>0)try{d.cropUrl=await crop(img,b)}catch(e){}}
 if(JSON.stringify(d).length>230000)d.fullUrl="";
 await db.collection("attempts").add(d)}

$("next").onclick=()=>{idx++;if(idx>=problems.length){$("practice").classList.add("hide");$("done").classList.remove("hide");$("score").textContent=`You got ${right} of ${problems.length} correct.`}else show()};
$("again").onclick=()=>{$("done").classList.add("hide");$("upload").classList.remove("hide");$("status").textContent="";$("prev").classList.add("hide");$("file").value="";blob=null;$("go").disabled=true};

/* ---------- teacher ---------- */
function listen(){db.collection("attempts").orderBy("ts","desc").limit(150).onSnapshot(s=>{all=s.docs.map(d=>({id:d.id,...d.data()}));
 if(document.activeElement&&document.activeElement.tagName==="TEXTAREA")return;render()},e=>{$("feed").innerHTML='<p class="err">Could not load: '+esc(e.message)+'</p>'})}
$("onlyBad").onchange=render;$("who").onchange=render;
function render(){const names=[...new Set(all.map(a=>a.studentName))],sel=$("who").value||"";
 $("who").innerHTML='<option value="">All students</option>'+names.map(n=>`<option ${n===sel?"selected":""}>${esc(n)}</option>`).join("");
 $("stats").innerHTML=names.map(n=>{const l=all.filter(a=>a.studentName===n),c=l.filter(a=>a.correct).length;
  return`<div class="stat">${esc(n)}<b>${Math.round(c/l.length*100)}%</b><span class="sub">${l.length} attempts · ${l.length-c} mistakes</span></div>`}).join("");
 const list=all.filter(a=>(!sel||a.studentName===sel)&&(!$("onlyBad").checked||!a.correct));
 $("feed").innerHTML=list.length?list.map(a=>{const c=safeImg(a.cropUrl),f=safeImg(a.fullUrl);
  return`<div class="item"><div class="row" style="margin:0"><b>${esc(a.studentName)}</b><span>Q${esc(a.label)}</span><span class="pill ${a.correct?"ok":"bad"}">${a.correct?"Correct":"Mistake"}</span>${a.reviewed?'<span class="pill ok">Reviewed</span>':""}<span class="sub" style="margin:0 0 0 auto">${new Date(a.ts).toLocaleString()}</span></div>
  <p style="margin:8px 0"><b>Question:</b> ${esc(a.question)}</p>
  ${c?`<p style="margin:6px 0 0"><b>The wrong step, in the student's own writing:</b></p><img class="proof" src="${c}" alt="wrong step">`:""}
  ${a.firstWrongStep?`<p style="margin:8px 0"><b>Wrong step (read as text):</b> <code>${esc(a.firstWrongStep)}</code></p>`:""}
  ${a.explanation?`<p style="margin:8px 0"><b>AI diagnosis:</b> ${esc(a.explanation)}</p>`:""}
  ${f?`<details><summary>See the student's full working</summary><img class="proof" src="${f}" alt="full working"></details>`:a.transcription?`<details><summary>Student's typed working</summary><div style="white-space:pre-wrap">${esc(a.transcription)}</div></details>`:""}
  <textarea data-n="${a.id}" rows="2" placeholder="Your mentoring note for this student…">${esc(a.teacherNote)}</textarea>
  <div class="row"><button data-s="${a.id}">Save note &amp; mark reviewed</button></div></div>`}).join(""):'<p class="sub">Nothing to show yet.</p>'}
$("feed").onclick=async e=>{const id=e.target.dataset.s;if(!id)return;const t=document.querySelector(`[data-n="${id}"]`).value;
 e.target.disabled=true;try{await db.doc("attempts/"+id).update({teacherNote:t,reviewed:true});e.target.textContent="Saved ✓"}catch(x){e.target.textContent="Failed"}};
</script></body></html>
